<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/formulario.css">
    <title>Trabalhe Conosco</title>
</head>

<body>
    <main>
        <div class="cabecalho">
            <h1>Naoya Games 🎮</h1>
            <p>Trabalhe Conosco</p>
        </div>

        <form>
            <div class="campo">
                <label for="nome"><strong>Nome</strong></label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="sobrenome"><strong>Sobrenome</strong></label>
                <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
            </div>

            <div class="campo">
                <label for="email"><strong>Email</strong></label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            </div>

            <div class="campo">
                <p><strong>Qual vaga você deseja?</strong></p>

                <label>
                    <input type="radio" name="vaga" value="vendedor">
                    Vendedor
                </label>

                <label>
                    <input type="radio" name="vaga" value="atendente">
                    Atendente
                </label>

                <label>
                    <input type="radio" name="vaga" value="jovem-aprendiz">
                    Jovem Aprendiz
                </label>
            </div>

            <div class="campo">
                <label for="escolaridade"><strong>Escolaridade</strong></label>

                <select id="escolaridade" name="escolaridade" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="fundamental">Ensino Fundamental</option>
                    <option value="medio">Ensino Médio</option>
                    <option value="superior">Ensino Superior</option>
                </select>
            </div>

            <div class="campo">
                <p><strong>Áreas que você gosta:</strong></p>

                <label>
                    <input type="checkbox" name="area" value="games">
                    Games
                </label>

                <label>
                    <input type="checkbox" name="area" value="informatica">
                    Informática
                </label>

                <label>
                    <input type="checkbox" name="area" value="atendimento">
                    Atendimento
                </label>
            </div>

            <div class="campo">
                <label for="sobre"><strong>Sobre você</strong></label>
                <textarea id="sobre" name="sobre" rows="6" placeholder="Conte um pouco sobre você"></textarea>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Naoya Games</p>
    </footer>
</body>
</html>
